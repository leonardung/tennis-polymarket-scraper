name: polymarket-exploratory

services:
  evidence:
    build: .
    image: polymarket:evidence
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - evidence
      - --db=/source/tennis.db
      - --output=/evidence/exploratory-evidence.db
      - --interval=300
    volumes:
      - ./data:/source:ro
      - ./evidence-data:/evidence
    environment:
      TZ: "${TZ:-UTC}"
