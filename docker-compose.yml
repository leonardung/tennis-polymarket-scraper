# Two containers off one image: the capture writes data/tennis.db, the dashboard
# reads it. They are separate services rather than one because they fail and
# restart independently -- reloading the dashboard must never interrupt a
# recording, and a recording is the one thing here that cannot be redone later.

x-polymarket: &polymarket
  build: .
  image: polymarket:latest
  restart: unless-stopped
  # Both processes touch the same file, so both must be the same uid as whoever
  # owns ./data on the host. Set PUID/PGID in a .env file if yours is not 1000.
  user: "${PUID:-1000}:${PGID:-1000}"
  volumes:
    - ./data:/data
  environment:
    # Log timestamps only; nothing in the capture reads the clock's zone.
    TZ: "${TZ:-UTC}"

services:
  capture:
    <<: *polymarket
    command:
      - run
      - --db=/data/tennis.db
      # 5s is the default; it is spelled out because it is the one number here
      # worth changing, and --interval covers books and scores together.
      - --interval=2
      # Record the book from the moment a match is listed, not from its first
      # point: the hours before a match are when the price moves on news, and
      # they cannot be recovered afterwards.
      - --include-upcoming
    # The database exists from the moment the store opens, which is before the
    # first poll -- so this reports "ready" as soon as the dashboard has
    # something to open, rather than waiting for a match to be in play.
    healthcheck:
      test: ["CMD", "test", "-f", "/data/tennis.db"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  dashboard:
    <<: *polymarket
    command:
      - dashboard
      - --db=/data/tennis.db
      # 0.0.0.0 inside the container only; the port publish below is what
      # decides who can actually reach it, and that is localhost.
      - --host=0.0.0.0
      - --no-open
    ports:
      - "127.0.0.1:8787:8787"
    # Without this the dashboard would start first often enough to matter and
    # exit 1 on a database that is about to exist.
    depends_on:
      capture:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/pulse')
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reaches the dashboard from outside the house, through a Cloudflare tunnel.
  # The connection is outbound -- cloudflared dials Cloudflare and traffic comes
  # back down that pipe -- so no port is forwarded, and the host still opens
  # nothing to the internet. The dashboard's own publish stays on localhost.
  #
  # The tunnel's origin must be `http://dashboard:8787` -- the service name,
  # which is its hostname on this network -- and not localhost:8787, which
  # inside this container is this container.
  #
  # Sharing the dashboard's network namespace would make localhost:8787 correct
  # and save that configuration, but it fails badly: recreating the dashboard
  # leaves cloudflared holding a dead namespace, still reporting Up while every
  # request 502s. `docker compose up -d` after a rebuild does exactly that.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # As an environment variable rather than `--token` on the command line,
    # where `docker compose ps` and the host's process list would both show it.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in .env -- copy .env.example}
    depends_on:
      dashboard:
        condition: service_healthy
